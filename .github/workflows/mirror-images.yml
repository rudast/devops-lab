# Копирует базовые образы курса из Docker Hub в GitHub Container Registry (GHCR),
# чтобы студенты скачивали их из ghcr.io, а не из Docker Hub.
# Копируются все архитектуры (amd64 для ВМ/Windows, arm64 для Mac на M1–M4).
name: mirror-images

on:
  workflow_dispatch:                 # ручной запуск: Actions → mirror-images → Run workflow
  push:
    branches: [main]
    paths: ['.github/workflows/mirror-images.yml']
  schedule:
    - cron: '0 3 1 * *'              # раз в месяц — подтянуть обновления тегов

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { src: docker.io/library/postgres:17-alpine,   dst: postgres:17-alpine }
          - { src: docker.io/library/redis:7-alpine,       dst: redis:7-alpine }
          - { src: docker.io/library/python:3.12-slim,     dst: python:3.12-slim }
          - { src: docker.io/library/nginx:1.27-alpine,    dst: nginx:1.27-alpine }
          - { src: docker.io/library/hello-world:latest,   dst: hello-world:latest }
          - { src: docker.io/zricethezav/gitleaks:latest,  dst: gitleaks:latest }
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy ${{ matrix.src }}
        run: |
          dst="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.dst }}"
          docker buildx imagetools create --tag "$dst" "${{ matrix.src }}"
          docker buildx imagetools inspect "$dst" | head -20
