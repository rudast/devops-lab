# Занятие 9: та же связка, но БЕЗ секретов в файле.
# Значения подставляются из файла .env (лежит рядом, в Git НЕ коммитится).
# Синтаксис ${VAR:?текст} — упасть с ошибкой, если переменная не задана.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:7-alpine
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-appdb}
      REDIS_URL: redis://cache:6379/0
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${BACKEND_PORTS:-8000-8005}:8000"
    networks: [backend-net]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

networks:
  backend-net:

volumes:
  pgdata:
