# Nginx как reverse proxy (L7) перед бэкендом.
# "backend" — имя сервиса в compose; при --scale backend=3 Docker DNS вернёт 3 IP,
# nginx при старте раскроет их в upstream и будет балансировать round-robin.
upstream backend_pool {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Не показываем версию nginx наружу
    server_tokens off;

    location / {
        proxy_pass http://backend_pool;

        # Передаём бэкенду информацию об исходном запросе
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;
    }

    # Health-check самого прокси (удобно для мониторинга)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}

